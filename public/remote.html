<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="置き配番アプリに今の写真の撮影を依頼します。写真はご自身の Gmail に届きます。">
  <meta name="theme-color" content="#0d2a22">
  <link rel="icon" type="image/png" href="/assets/okihaiban_app_icon_512x512.png">
  <title>リモート撮影 | 置き配番</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root { color-scheme: light; --ink:#171d1b; --muted:#5b6661; --paper:#fbfaf4; --green:#0c5b46; --line:rgba(23,29,27,.16); --bad:#a5362c; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,-apple-system,sans-serif; line-height:1.7; }
    header { background:#0d2a22; color:#fff; padding:12px max(18px,calc((100vw - 640px)/2)); display:flex; align-items:center; gap:12px; }
    header a { display:inline-flex; align-items:center; gap:9px; color:inherit; text-decoration:none; font-weight:800; }
    header img { width:38px; height:38px; object-fit:contain; background:#fff; border-radius:50%; }
    header select { margin-left:auto; padding:7px; border:1px solid #b8d3c7; border-radius:8px; background:#fff; color:var(--ink); }
    main { max-width:640px; margin:auto; padding:28px 18px 64px; }
    h1 { font-size:clamp(1.7rem,5vw,2.2rem); margin:0 0 8px; }
    .lead,.note { color:var(--muted); }
    .card { background:#fff; border:1px solid var(--line); border-radius:15px; padding:20px; margin:20px 0; box-shadow:0 8px 24px rgba(16,30,25,.05); }
    h2 { font-size:1.1rem; margin:0 0 10px; }
    ul { margin:0; padding-left:1.4em; }
    li+li { margin-top:7px; }
    .hidden { display:none !important; }
    .account { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    button { cursor:pointer; font:inherit; }
    #signout { background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px 10px; }
    #shoot { width:100%; margin-top:16px; padding:14px; background:var(--green); border:0; border-radius:10px; color:#fff; font-weight:800; }
    #shoot:disabled { opacity:.48; cursor:not-allowed; }
    #monitor { margin:16px 0 0; font-weight:700; }
    #monitor.good { color:var(--green); }
    #monitor.bad,#status.bad { color:var(--bad); }
    #status { min-height:1.7em; font-weight:700; }
    #status.good { color:var(--green); }
    .note { font-size:.92rem; }
    .note a { color:var(--green); }
  </style>
</head>
<body>
  <header>
    <a href="/"><img src="/assets/logo_navy_transparent.png" alt="" width="38" height="38"><span>置き配番</span></a>
    <select id="lang" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option></select>
  </header>
  <main>
    <h1 id="title"></h1>
    <p id="lead" class="lead"></p>
    <section class="card" aria-labelledby="conditions-title">
      <h2 id="conditions-title"></h2>
      <ul id="conditions"></ul>
    </section>
    <section class="card" id="signin-card">
      <p id="signin-help"></p>
      <div id="google-button"></div>
    </section>
    <section class="card hidden" id="app-card">
      <div class="account"><span id="account" class="note"></span><button id="signout" type="button"></button></div>
      <p id="monitor" role="status"></p>
      <p id="monitor-help" class="note"></p>
      <button id="shoot" type="button" disabled></button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="note"><a id="privacy-link" href="/privacy-policy"></a></p>
  </main>
  <script>
    'use strict';
    const BASE = 'https://asia-northeast1-okihaiban.cloudfunctions.net';
    const CLIENT_ID = '706346073921-lj9tjaan0mbglh2catsgo0e5von6hg1n.apps.googleusercontent.com';
    const POLL_INTERVAL_MS = 2000;
    const POLL_TIMEOUT_MS = 10000;
    const I18N = {
      ja: {
        title:'リモート撮影', lead:'置き配番アプリを入れたスマホで、今の写真を撮影します。', conditionsTitle:'撮れる条件',
        conditions:['置き配番アプリを画面に開いていること','置き配番アプリの設定で「リモート撮影を受け付ける」がオンであること','このページで、置き配番アプリでログインしている Google アカウントでログインすること','写真はご自身の Gmail に届き、このページやサーバーには保存されません。'],
        signinHelp:'置き配番アプリでログインしている Google アカウントでログインしてください。', signout:'ログアウト', account:'{email} でログイン中', checking:'このGoogleアカウントでリモート撮影を受け付けている置き配番アプリを確認しています…', noMonitor:'このGoogleアカウントでリモート撮影を受け付けている置き配番アプリがありません', noMonitorHelp:'置き配番アプリの設定で「③ リモート撮影を受け付ける」をオンにしてください。月額プランが切れると自動でオフになります。', linked:'このGoogleアカウントでリモート撮影を受け付けている置き配番アプリがあります', shoot:'置き配番アプリで今すぐ撮る', privacy:'プライバシーポリシー',
        sending:'撮影しています', waiting:'要求を送信しました。応答を待っています', captured:'Gmailに撮影画像を送信しました', pending:'撮影しました。写真は送信待ちです。届いたらメールでお知らせします。届かないときは置き配番アプリでご確認ください。',
        signInRequired:'Google アカウントへもう一度サインインしてください。', doorNotConfigured:'リモート撮影を受け付けている置き配番アプリが見つかりません。置き配番アプリで「リモート撮影を受け付ける」がオンか、同じ Google アカウントでログインしているか確認してください。', minuteLimit:'1分あたりの撮影回数に達しました。少し待ってからお試しください。', dailyLimit:'1日あたりの撮影回数に達しました。翌日以降にお試しください。', deleting:'アカウントのデータを削除中のため、撮影を依頼できません。', temporaryFailure:'通信できませんでした。時間をおいて、もう一度お試しください。',
        appNotForeground:'置き配番アプリが画面に開かれていません。アプリを開いてください', notEntitled:'置き配番アプリの月額プランが有効ではないため、撮影できません。', cameraUnavailable:'置き配番アプリがカメラを使えません', notAuthorized:'置き配番アプリの設定を確認してください', mailFailed:'撮影しましたがメールを送れませんでした', failedOther:'撮影できませんでした。時間をおいてお試しください', timeout:'結果を確認できませんでした。メールをご確認ください。'
      },
      en: {
        title:'Remote capture', lead:'Take a photo now with a phone running the Okihaiban app.', conditionsTitle:'Before you take a photo',
        conditions:['The Okihaiban app is open on the screen','Turn on “Accept remote capture requests” in the Okihaiban app settings.','Sign in here with the Google Account you use in the Okihaiban app.','The photo arrives in your own Gmail. It is not stored on this page or on our servers.'],
        signinHelp:'Sign in with the Google Account you use in the Okihaiban app.', signout:'Sign out', account:'Signed in as {email}', checking:'Checking for an Okihaiban app accepting remote capture for this Google Account…', noMonitor:'No Okihaiban app is accepting remote capture for this Google Account', noMonitorHelp:'Turn on "3 Accept remote capture" in the Okihaiban app settings. It turns off automatically when the monthly plan ends.', linked:'An Okihaiban app is accepting remote capture for this Google Account', shoot:'Take a photo now with the Okihaiban app', privacy:'Privacy policy',
        sending:'Taking photo', waiting:'Capture request sent. Waiting for a response', captured:'The captured image was sent to Gmail', pending:'The photo was taken and is waiting to be sent. We’ll notify you by email when it arrives. If it does not arrive, check the Okihaiban app.',
        signInRequired:'Sign in to your Google account again.', doorNotConfigured:'No Okihaiban app accepting remote capture was found. In the Okihaiban app, check that “Accept remote capture requests” is on and that you are signed in with the same Google Account.', minuteLimit:'The per-minute capture limit was reached. Wait a moment and try again.', dailyLimit:'The daily capture limit was reached. Try again tomorrow.', deleting:'The account data is being deleted, so a capture cannot be requested.', temporaryFailure:'Could not connect. Wait a while and try again.',
        appNotForeground:'The Okihaiban app is not open on the screen. Open the app and try again', notEntitled:"The Okihaiban app's monthly plan isn't active, so it can't take a photo.", cameraUnavailable:'The Okihaiban app cannot use the camera', notAuthorized:'Check the Okihaiban app settings', mailFailed:'The photo was captured, but the email could not be sent', failedOther:'The photo could not be captured. Wait a while and try again', timeout:'The result could not be confirmed. Check your email.'
      }
    };
    const $ = id => document.getElementById(id);
    const forced = new URLSearchParams(location.search).get('lang');
    let lang = forced === 'ja' || forced === 'en' ? forced : /^ja(?:-|$)/i.test(navigator.language || 'ja') ? 'ja' : 'en';
    let token = null;
    let email = '';
    let linked = false;
    let busy = false;
    let generation = 0;
    let monitorKey = '';
    let statusKey = '';
    let statusKind = '';
    const T = () => I18N[lang];
    function render() {
      const t = T();
      document.documentElement.lang = lang;
      document.title = t.title + ' | 置き配番';
      $('lang').value = lang;
      for (const id of ['title','lead','conditionsTitle','signinHelp','signout','shoot']) {
        const node = $(id === 'conditionsTitle' ? 'conditions-title' : id === 'signinHelp' ? 'signin-help' : id);
        node.textContent = t[id];
      }
      $('conditions').replaceChildren(...t.conditions.map(value => { const li = document.createElement('li'); li.textContent = value; return li; }));
      $('account').textContent = t.account.replace('{email}', email);
      $('monitor').textContent = monitorKey ? t[monitorKey] : '';
      $('monitor').className = monitorKey === 'linked' ? 'good' : monitorKey === 'noMonitor' ? 'bad' : '';
      $('monitor-help').textContent = monitorKey === 'noMonitor' ? t.noMonitorHelp : '';
      $('status').textContent = statusKey ? t[statusKey] : '';
      $('status').className = statusKind;
      $('privacy-link').textContent = t.privacy;
      $('shoot').disabled = !token || !linked || busy;
    }
    function setStatus(key, kind = '') { statusKey = key; statusKind = kind; render(); }
    function requireSignIn() {
      generation++;
      token = null; email = ''; linked = false; busy = false; monitorKey = '';
      $('app-card').classList.add('hidden'); $('signin-card').classList.remove('hidden');
      render();
    }
    async function call(name, body = {}, timeoutMs = 15000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(BASE + '/' + name, {
          method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + token },
          body:JSON.stringify(body), signal:controller.signal
        });
        let data = null;
        try { data = await response.json(); } catch (_) { /* Invalid response is a failure. */ }
        return { httpStatus:response.status, data };
      } catch (_) { return { httpStatus:0, data:null }; }
      finally { clearTimeout(timer); }
    }
    async function refreshMonitor() {
      if (!token) return;
      const current = generation;
      linked = false; monitorKey = 'checking'; render();
      const result = await call('getMonitorStatus');
      if (current !== generation) return;
      if (result.httpStatus === 401) { requireSignIn(); setStatus('signInRequired','bad'); return; }
      if (result.httpStatus !== 200 || typeof result.data?.linked !== 'boolean') {
        monitorKey = ''; setStatus('temporaryFailure','bad'); return;
      }
      linked = result.data.linked;
      monitorKey = linked ? 'linked' : 'noMonitor';
      render();
    }
    function failureKey(reason) {
      return ({ app_not_foreground:'appNotForeground', not_entitled:'notEntitled', camera_unavailable:'cameraUnavailable', not_authorized:'notAuthorized', mail_failed:'mailFailed' })[reason] || 'failedOther';
    }
    async function pollResult(requestId, current) {
      const deadline = Date.now() + POLL_TIMEOUT_MS;
      while (current === generation) {
        const remaining = deadline - Date.now();
        if (remaining <= 0) return ['timeout',''];
        await new Promise(resolve => setTimeout(resolve, Math.min(POLL_INTERVAL_MS, remaining)));
        if (current !== generation) return null;
        const timeLeft = deadline - Date.now();
        if (timeLeft <= 0) return ['timeout',''];
        const result = await call('getCaptureResult', { requestId }, timeLeft);
        if (current !== generation) return null;
        if (result.httpStatus === 401) { requireSignIn(); setStatus('signInRequired','bad'); return null; }
        if (Date.now() >= deadline) return ['timeout',''];
        if (result.httpStatus !== 200 || !result.data) return ['temporaryFailure','bad'];
        const data = result.data;
        if (data.status === 'captured') return ['captured','good'];
        if (data.status === 'captured_pending_send') return ['pending',''];
        if (data.status === 'failed') return [failureKey(data.reason),'bad'];
        if (data.status !== 'sent') return ['temporaryFailure','bad'];
      }
      return null;
    }
    async function shoot() {
      if (!token || !linked || busy) return;
      busy = true; render(); setStatus('sending');
      const current = generation;
      const result = await call('capturePage', {});
      if (current !== generation) return;
      if (result.httpStatus === 401) { requireSignIn(); setStatus('signInRequired','bad'); return; }
      if (result.httpStatus !== 200 || !result.data?.requestId) {
        let key = 'temporaryFailure';
        if (result.httpStatus === 503) key = 'doorNotConfigured';
        else if (result.httpStatus === 409) key = 'deleting';
        else if (result.httpStatus === 429 && result.data?.reason === 'minute_limit') key = 'minuteLimit';
        else if (result.httpStatus === 429 && result.data?.reason === 'daily_limit') key = 'dailyLimit';
        busy = false; setStatus(key,'bad');
        if (result.httpStatus === 503) refreshMonitor();
        return;
      }
      setStatus('waiting');
      const outcome = await pollResult(result.data.requestId, current);
      if (current !== generation || !outcome) return;
      busy = false; setStatus(outcome[0],outcome[1]);
    }
    function emailFromToken(value) {
      try { return JSON.parse(atob(value.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).email || ''; }
      catch (_) { return ''; }
    }
    function onCredential(response) {
      if (!response?.credential) return;
      generation++; token = response.credential; email = emailFromToken(token);
      linked = false; busy = false; monitorKey = ''; statusKey = '';
      $('signin-card').classList.add('hidden'); $('app-card').classList.remove('hidden');
      render(); refreshMonitor();
    }
    function initGoogle() {
      if (!window.google?.accounts?.id) { setTimeout(initGoogle, 200); return; }
      google.accounts.id.initialize({ client_id:CLIENT_ID, callback:onCredential, auto_select:false });
      google.accounts.id.renderButton($('google-button'), { theme:'outline', size:'large', shape:'pill', text:'signin_with' });
    }
    $('lang').addEventListener('change', event => { lang = event.target.value; render(); });
    $('shoot').addEventListener('click', shoot);
    $('signout').addEventListener('click', () => { window.google?.accounts?.id?.disableAutoSelect(); requireSignIn(); setStatus(''); });
    render(); initGoogle();
  </script>
</body>
</html>
