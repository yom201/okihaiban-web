<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620">
  <defs>
    <linearGradient id="heat" x1="0" x2="1">
      <stop stop-color="#ff4b3f"/>
      <stop offset="1" stop-color="#f4b332"/>
    </linearGradient>
    <marker id="heat-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 6 3 0 6" fill="none" stroke="#f4b332" stroke-width="2"/>
    </marker>
    <marker id="light-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 6 3 0 6" fill="none" stroke="#ffe300" stroke-width="2"/>
    </marker>
    <g id="person" fill="#f7fbff">
      <circle cx="100" cy="135" r="22"/>
      <path d="M78 165 Q100 150 122 165 L140 225 Q140 235 129 234 L116 195 116 239 129 277 Q130 289 117 289 L101 250 84 289 Q70 291 72 278 L85 239 85 195 70 232 Q57 238 59 223Z"/>
