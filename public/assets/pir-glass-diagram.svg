  <g font-family="Hiragino Sans, Yu Gothic, system-ui, sans-serif" font-size="28" font-weight="700" fill="#f7fbff" text-anchor="middle">
    <text x="360" y="46">遠赤外線（熱）はガラスで止まる</text>
    <text x="360" y="84">人感センサーに届かない</text>
    <text x="360" y="356" fill="#ffe300">目に見える光はガラスを通る</text>
    <text x="360" y="394">スマホのカメラに届く</text>
