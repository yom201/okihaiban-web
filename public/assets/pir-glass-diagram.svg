  <path d="M146 198 Q160 173 174 198 T202 198 T230 198 T258 198 T286 198 L310 198" fill="none" stroke="url(#heat)" stroke-width="6" marker-end="url(#heat-arrow)"/>
  <path d="M321 180L341 216 M341 180L321 216" stroke="#ff4b3f" stroke-width="6" stroke-linecap="round"/>
